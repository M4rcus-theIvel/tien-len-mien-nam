<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tiến Lên Miền Nam</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1b5e20;
            color: white;
            margin: 0;
            padding: 15px;
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
        }

        .bots {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .bot-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.2s;
            min-width: 130px;
        }

        .active-turn {
            border-color: #ffca28;
            background: rgba(255, 202, 40, 0.25);
            transform: scale(1.05);
        }

        .middle-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 1050px;
            margin: 0 auto 20px;
            flex-wrap: wrap;
        }

        .table-area {
            flex: 2;
            min-width: 360px;
            min-height: 175px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .log-area {
            flex: 1;
            min-width: 300px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: left;
            font-size: 13px;
        }

        .log-area ul {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
        }

        .log-area li {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-area li:first-child {
            color: #81c784;
            font-weight: bold;
        }

        .hand {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-label {
            cursor: pointer;
            user-select: none;
        }

        .card-checkbox {
            display: none;
        }

        .card {
            width: 78px;
            height: 115px;
            background: white;
            color: #212121;
            border-radius: 8px;
            box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            transition: transform 0.15s;
        }

        .card-checkbox:checked+.card {
            transform: translateY(-18px);
            border: 3px solid #ffca28;
            background-color: #fffde7;
        }

        .red {
            color: #d32f2f;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-play {
            background: #ffb300;
            color: black;
        }

        .btn-pass {
            background: #78909c;
            color: white;
        }

        .btn-reset {
            background: #e53935;
            color: white;
        }
    </style>
</head>

<body>

    <div class="status-bar" th:text="${message}">Trạng thái ván đấu</div>

    <!-- 3 Bot -->
    <div class="bots">
        <div class="bot-box" th:each="i : ${#numbers.sequence(1, 3)}"
            th:classappend="${currentTurn == i and winner == null} ? 'active-turn' : ''">
            <strong th:text="${players[i].name}">Bot</strong>
            <div>Còn: <span th:text="${players[i].hand.size()}">13</span> lá</div>
            <div th:if="${players[i].passed}" style="color: #ffab91; font-size: 13px;">(Đã bỏ lượt)</div>
            <div th:if="${currentTurn == i and winner == null}"
                style="color: #ffeb3b; font-size: 13px; margin-top: 4px;">⏳ Đang đánh...</div>
        </div>
    </div>

    <!-- Khu vực giữa bàn + Nhật ký -->
    <div class="middle-section">
        <div class="table-area">
            <div th:if="${tableMove != null}" style="margin-bottom: 10px; font-weight: bold; color: #b2ff59;">
                <span th:text="${lastPlayedPlayer}">Bot 2</span> vừa đánh:
            </div>
            <div th:if="${tableMove == null}" style="opacity: 0.6;">Bàn trống - Chờ đánh vòng mới</div>

            <div class="hand" th:if="${tableMove != null}">
                <div th:each="card : ${tableMove.cards}" class="card"
                    th:classappend="${card.suit == 'Hearts' or card.suit == 'Diamonds'} ? 'red' : ''">
                    <span th:text="${card.displayName}">3</span>
                    <span style="font-size: 24px;"
                        th:text="${card.suit == 'Hearts' ? '♥' : (card.suit == 'Diamonds' ? '♦' : (card.suit == 'Clubs' ? '♣' : '♠'))}">♠</span>
                </div>
            </div>
        </div>

        <div class="log-area">
            <strong>Diễn biến ván đấu:</strong>
            <ul>
                <li th:each="log : ${logs}" th:text="${log}">Log</li>
            </ul>
        </div>
    </div>

    <!-- Bài của bạn -->
    <div>
        <h3>
            Bài của bạn (<span th:text="${players[0].hand.size()}">13</span> lá)
            <span th:if="${currentTurn == 0 and winner == null}" style="color: #ffeb3b;"> - TỚI LƯỢT BẠN!</span>
        </h3>
        <form action="/play" method="post">
            <div class="hand">
                <label class="card-label" th:each="card, stat : ${players[0].hand}">
                    <input type="checkbox" class="card-checkbox" name="selectedIndices" th:value="${stat.index}">
                    <div class="card" th:classappend="${card.suit == 'Hearts' or card.suit == 'Diamonds'} ? 'red' : ''">
                        <span th:text="${card.displayName}">Ace</span>
                        <span style="font-size: 24px;"
                            th:text="${card.suit == 'Hearts' ? '♥' : (card.suit == 'Diamonds' ? '♦' : (card.suit == 'Clubs' ? '♣' : '♠'))}">♥</span>
                    </div>
                </label>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-play" th:disabled="${currentTurn != 0 or winner != null}">Đánh
                    bài</button>
                <button type="submit" formaction="/pass" class="btn-pass"
                    th:disabled="${currentTurn != 0 or winner != null}">Bỏ lượt</button>
                <button type="submit" formaction="/reset" class="btn-reset">Ván mới</button>
            </div>
        </form>
    </div>

    <script th:if="${isBotTurn}">
        setTimeout(function () {
            window.location.href = "/bot-step";
        }, 2500);
    </script>

</body>

</html>
